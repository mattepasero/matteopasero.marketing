<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard Meta Ads — Matteo Pasero Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --bg: #0e0e0e;
    --panel: #161616;
    --line: #2a2a2a;
    --text: #f2f2f0;
    --text-muted: #9a9a94;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Barlow', system-ui, sans-serif;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .card {
    width: 100%; max-width: 460px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 40px 32px; text-align: center;
  }
  .eyebrow {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    font-size: 13px; color: var(--gold); margin-bottom: 10px;
  }
  h1 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 34px; margin: 0 0 14px; letter-spacing: -0.01em;
  }
  p {
    font-size: 15px; line-height: 1.55; color: var(--text-muted);
    margin: 0 0 28px;
  }
  a.cta {
    display: inline-block; width: 100%;
    background: var(--gold); color: #14120a;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600;
    font-size: 17px; letter-spacing: 0.02em;
    padding: 14px 20px; border-radius: 9px;
    text-decoration: none;
  }
  a.cta:hover { filter: brightness(1.08); }
  .note {
    margin-top: 18px; font-size: 12.5px; color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Matteo Pasero Marketing</div>
    <h1>Dashboard Meta Ads</h1>
    <p>Profili e campagne di tutti i clienti, aggiornati in tempo reale. La dashboard vive su claude.ai per restare collegata in diretta a Meta.</p>
    <a class="cta" href="https://claude.ai/artifact/LartdAd3Lws6YFybhMDaKf" target="_blank" rel="noopener">Apri la dashboard →</a>
    <div class="note">Serve una sessione Claude autorizzata per vedere i dati.</div>
  </div>
</body>
</html>
